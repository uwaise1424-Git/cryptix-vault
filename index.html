<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptix — Zero-Trust Secure File Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 font-sans">

    <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl mb-6">
        <!-- Header -->
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="text-3xl font-bold tracking-tight text-white">Cryptix Vault</h1>
        </div>

        <!-- 🔒 UPLOAD SECTION -->
        <div class="border-b border-slate-800 pb-6 mb-6">
            <h2 class="text-sm font-bold text-indigo-400 uppercase tracking-wider mb-4">1. Encrypt & Store</h2>
            <div class="mb-3">
                <input type="password" id="uploadPassphrase" placeholder="Enter Secret Passphrase..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:border-indigo-500 outline-none transition text-slate-200">
            </div>
            <div class="mb-4">
                <input type="file" id="fileInput" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-slate-950 border border-slate-700 rounded-lg">
            </div>
            <button id="uploadBtn" onclick="handleUpload()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg shadow-indigo-600/20 flex justify-center items-center">
                <span id="uploadBtnText">🔒 Lock & Upload to AWS</span>
            </button>
        </div>

        <!-- 🔓 DOWNLOAD SECTION -->
        <div>
            <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider mb-4">2. Retrieve & Decrypt</h2>
            <div class="mb-3">
                <input type="text" id="downloadFileKey" placeholder="Paste your S3 Object Key here (e.g., vault/...)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:border-cyan-500 outline-none transition text-slate-200">
            </div>
            <div class="mb-4">
                <input type="password" id="downloadPassphrase" placeholder="Enter Secret Passphrase to Decrypt..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:border-cyan-500 outline-none transition text-slate-200">
            </div>
            <button id="downloadBtn" onclick="handleDownload()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg shadow-cyan-600/20 flex justify-center items-center">
                <span id="downloadBtnText">🔓 Fetch & Decrypt Locally</span>
            </button>
        </div>

        <!-- STATUS LOG -->
        <div class="mt-6 bg-slate-950 border border-slate-800 rounded-lg p-4">
            <div class="text-xs font-mono text-slate-500 uppercase tracking-wider mb-1">System Audit Log</div>
            <div id="status" class="text-xs font-mono text-slate-300 break-all leading-relaxed">Status: Ready.</div>
        </div>
    </div>

    <!-- Link the crypto engine -->
    <script src="cryptoEngine.js"></script>
    
    <script>
        // API Gateway Invoke URL
        const API_ENDPOINT = "https://qfvs520bu3.execute-api.ap-southeast-2.amazonaws.com/get-upload-url";
        
        // Loading Spinner SVG
        const spinner = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

        // Copy to Clipboard Utility
        function copyVaultKey(keyText) {
            navigator.clipboard.writeText(keyText).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "Copied!";
                btn.classList.replace('bg-slate-700', 'bg-emerald-600');
                setTimeout(() => {
                    btn.innerText = "📋 Copy Key";
                    btn.classList.replace('bg-emerald-600', 'bg-slate-700');
                }, 2000);
            });
        }

        async function handleUpload() {
            const passphrase = document.getElementById('uploadPassphrase').value;
            const fileInput = document.getElementById('fileInput').files[0];
            const status = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');
            const btnText = document.getElementById('uploadBtnText');
            
            if (!passphrase || !fileInput) return alert("Please enter a passphrase and select a file!");
            
            try {
                // UI: Start Loading State
                btn.disabled = true;
                btn.classList.add('opacity-75', 'cursor-not-allowed');
                btnText.innerHTML = `${spinner} Encrypting & Uploading...`;

                status.innerHTML = `<span class="text-indigo-400">⚡ [1/3] Encrypting file locally via AES-256-GCM...</span>`;
                const arrayBuffer = await fileInput.arrayBuffer();
                const encryptedData = await encryptFileBuffer(arrayBuffer, passphrase);

                status.innerHTML = `<span class="text-indigo-400">📡 [2/3] Requesting S3 presigned PUT URL...</span>`;
                const apiResponse = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'upload', filename: fileInput.name + ".cryptix" })
                });
                
                const data = await apiResponse.json();
                const presignedUrl = data.url; 
                const fileKey = data.fileKey;

                status.innerHTML = `<span class="text-indigo-400">☁️ [3/3] Uploading ciphertext to Amazon S3...</span>`;
                await fetch(presignedUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/octet-stream' },
                    body: encryptedData
                });

                status.innerHTML = `
                    <span class="text-emerald-400 font-bold">✅ SUCCESS: File stored securely!</span><br><br>
                    <span class="text-slate-400">Your Vault Key:</span><br>
                    <span class="text-amber-400 font-bold select-all">${fileKey}</span><br>
                    <button id="copyBtn" onclick="copyVaultKey('${fileKey}')" class="mt-3 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-1 px-3 rounded transition">
                        📋 Copy Key
                    </button>
                `;
            } catch (err) {
                status.innerHTML = `<span class="text-rose-400 font-bold">❌ Error: ${err.message}</span>`;
            } finally {
                // UI: Reset Button State
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.innerHTML = `🔒 Lock & Upload to AWS`;
            }
        }

        async function handleDownload() {
            const fileKey = document.getElementById('downloadFileKey').value.trim();
            const passphrase = document.getElementById('downloadPassphrase').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('downloadBtn');
            const btnText = document.getElementById('downloadBtnText');
            
            if (!fileKey || !passphrase) return alert("Please enter the Object Key and your Passphrase!");
            
            try {
                // UI: Start Loading State
                btn.disabled = true;
                btn.classList.add('opacity-75', 'cursor-not-allowed');
                btnText.innerHTML = `${spinner} Fetching & Decrypting...`;

                status.innerHTML = `<span class="text-cyan-400">📡 [1/3] Requesting S3 presigned GET URL...</span>`;
                const apiResponse = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'download', fileKey: fileKey })
                });
                
                const data = await apiResponse.json();
                if (!data.url) throw new Error("Could not get download URL from AWS Lambda.");
                
                status.innerHTML = `<span class="text-cyan-400">☁️ [2/3] Downloading ciphertext from S3...</span>`;
                const s3Response = await fetch(data.url);
                
                if (!s3Response.ok) {
                    const awsError = await s3Response.text();
                    console.error("AWS S3 Error:", awsError);
                    throw new Error(`AWS blocked the download (HTTP ${s3Response.status}). Check browser console for details.`);
                }

                const encryptedBuffer = await s3Response.arrayBuffer();

                status.innerHTML = `<span class="text-cyan-400">⚡ [3/3] Decrypting file via AES-256-GCM...</span>`;
                const decryptedData = await decryptFileBuffer(encryptedBuffer, passphrase);
                
                const blob = new Blob([decryptedData], { type: "application/octet-stream" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                let originalName = fileKey.split('-').slice(5).join('-');
                a.download = "DECRYPTED_" + (originalName.replace('.cryptix', '') || "secure_file");
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                status.innerHTML = `<span class="text-emerald-400 font-bold">✅ SUCCESS: File decrypted and downloaded!</span>`;
            } catch (err) {
                status.innerHTML = `<span class="text-rose-400 font-bold">❌ Error: ${err.message}</span>`;
                console.error(err);
            } finally {
                // UI: Reset Button State
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.innerHTML = `🔓 Fetch & Decrypt Locally`;
            }
        }
    </script>
</body>
</html>
